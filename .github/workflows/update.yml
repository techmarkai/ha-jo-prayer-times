name: Update prayer times

on:
  schedule:
    - cron: "0 1 * * *" # 04:00 Amman
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/scrape.py
      - run: python tests/test_logic.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/jo_prayer_times/data
          git diff --cached --quiet || git commit -m "Update prayer times $(date -u +%F)" && git push
